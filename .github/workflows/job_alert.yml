name: BD Govt Job Alert

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch:         # "Run workflow" button
    inputs:
      from_date:
        description: "From date (e.g. 01-11-2026). Empty = today"
        required: false
        default: ""
      to_date:
        description: "To date (e.g. 12-11-2026). Empty = today"
        required: false
        default: ""

permissions:
  contents: write   # needed to save seen.json back to the repo

concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check sites and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          DATE_FROM: ${{ inputs.from_date }}
          DATE_TO: ${{ inputs.to_date }}
        run: python job_alert.py

      - name: Save seen.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seen.json
          # Manual runs: also keep the downloaded pages in the repo (debug/ folder),
          # so problems can be fixed from the real pages without hunting for Artifacts.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -d debug ]; then
            git add debug
          fi
          git diff --cached --quiet || git commit -m "Update seen circulars"
          git push

      - name: Upload downloaded pages (for fixing problems)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug/
          retention-days: 7
          if-no-files-found: ignore
